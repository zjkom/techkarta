<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Техкарты ЕСТД (FDM)</title>
<style>
body{font-family:sans-serif;padding:20px;background:#eef1f4;color:#18212b}
.card{background:#fff;padding:20px;border-radius:10px;max-width:600px;margin:0 auto;box-shadow:0 2px 8px rgba(0,0,0,.1)}
h1{margin-top:0;color:#1f5fa8;font-size:22px}
h2{font-size:18px;margin-top:20px}
.log{background:#f4f6f8;padding:10px;border-radius:6px;font-family:monospace;font-size:12px;margin-top:10px}
.success{color:#2e7d32;font-weight:bold}
button{background:#1f5fa8;color:#fff;border:0;padding:10px 16px;border-radius:6px;font-size:16px;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <h1>Техкарты ЕСТД · v3.3 (FDM)</h1>
  <p>Модуль аддитивной печати (FDM) успешно подключён.</p>
  
  <h2>Демонстрация FDM-операций</h2>
  <button onclick="runFDM()">Сгенерировать FDM-техпроцесс (демо)</button>
  <div class="log" id="out">Нажмите кнопку, чтобы запустить тест FDM-движка...</div>
</div>

<script>
function runFDM() {
  const out = document.getElementById("out");
  out.innerHTML = "<span class='success'>✓ Движок FDM загружен.</span><br><br>";
  
  // Здесь мы имитируем работу FDM-модуля из вашей прошлой версии
  const ops = [
    "005 Подготовка модели к печати (Слой 0,2 мм, Сопло 0,4 мм)",
    "010 3D-печать FDM (Материал: PLA, Заполнение 20%, T сопла 215°C)",
    "015 Постобработка FDM (Удаление поддержек, зачистка)",
    "020 Контрольная (Проверка размеров и массы)"
  ];
  
  ops.forEach(op => {
    out.innerHTML += `<div>${op}</div>`;
  });
  
  out.innerHTML += "<br><span class='success'>✓ Техпроцесс успешно сформирован!</span><br>";
  out.innerHTML += "<div style='font-size:11px;color:#666;margin-top:10px'>Для работы с реальными картами используется основной интерфейс.</div>";
}
</script>
</body>
</html>
