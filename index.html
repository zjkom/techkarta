<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Техкарты ЕСТД</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=PT+Sans+Narrow:wght@400;700&display=swap">
<style>
/* Layout: панель сверху, слева редактор (разделы), справа живой бланк A4 выбранного документа */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#18212b; --muted:#5d6874; --line:#cfd6de; --field:#f7f9fb;
  --accent:#1f5fa8; --accent-ink:#ffffff; --accent-soft:#e3ecf7; --warn:#b3261e;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#2d3743; --field:#141a21;
  --accent:#6fa4e6; --accent-ink:#0d1620; --accent-soft:#1d2c3e; --warn:#f2847b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#2d3743; --field:#141a21;
  --accent:#6fa4e6; --accent-ink:#0d1620; --accent-soft:#1d2c3e; --warn:#f2847b; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.top-in{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;max-width:1600px;margin:0 auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted)}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--warn)}
.btn.danger.arm{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn.sm{padding:3px 8px;font-size:12px}
select.sel{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:6px 8px;max-width:300px;min-width:0}

.wrap{max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;
  display:grid;grid-template-columns:minmax(0,580px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1050px){.wrap{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.pane-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:2px;background:var(--field);border:1px solid var(--line);border-radius:7px;padding:2px}
.tabs button{border:0;background:transparent;padding:5px 10px;border-radius:5px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pane-b{padding:14px 12px;display:grid;gap:14px}

fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.grid .w2{grid-column:span 2}.grid .wall{grid-column:1/-1}
label.f{display:grid;gap:2px;font-size:11.5px;color:var(--muted);min-width:0;align-content:start}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--field);border-radius:5px;padding:5px 7px;font-size:13.5px;color:var(--ink);width:100%;min-width:0}
label.f textarea{resize:vertical;min-height:34px}
label.f .calc{font-family:var(--f-mono)}
.intro{font-size:13px;color:var(--muted);max-width:62ch}
.intro b{color:var(--ink);font-weight:600}

.op{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.op-h{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;flex-wrap:wrap}
.op-n{font-family:var(--f-mono);font-weight:500;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 7px}
.op-t{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op-meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.op-b{border-top:1px solid var(--line);padding:10px;display:grid;gap:12px}
.sub{font-family:var(--f-display);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:4px;border-top:1px dashed var(--line)}
.tr{border-left:3px solid var(--accent-soft);padding:8px 0 8px 10px;display:grid;gap:8px}
.tr-h{display:flex;align-items:center;gap:8px}
.tr-h b{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.modes{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.hint{font-size:12px;color:var(--muted)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}
.item-h{display:flex;align-items:center;gap:8px}
.item-h b{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.thumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.thumb img{max-width:160px;max-height:90px;border:1px solid var(--line);border-radius:4px;background:#fff}

.prev-wrap{padding:14px;overflow:hidden}
.sheets{display:grid;gap:14px;justify-items:start}
.sheet-holder{overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.18);border-radius:2px}
.empty{padding:30px;color:var(--muted);text-align:center;max-width:52ch;margin:0 auto}
.doc-note{font-size:12.5px;color:var(--muted);padding:0 2px 10px;max-width:80ch}
.drop{border:2px dashed var(--line);border-radius:10px;padding:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--field)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.err{color:var(--warn);font-size:13px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px}
img.prof{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.tw{overflow-x:auto}
table.it{border-collapse:collapse;width:100%;font-size:13px}
table.it th{font-size:11.5px;color:var(--muted);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
table.it td{padding:3px 6px;border-bottom:1px solid var(--line)}
table.it td.nu{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.it select,table.it input{border:1px solid var(--line);background:var(--field);border-radius:4px;padding:3px 5px;font-size:12.5px;max-width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:7px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}

/* ---------- Бланк ЕСТД (общий для предпросмотра и файла печати) ---------- */
.sheet{width:297mm;height:210mm;background:#fff;color:#111;position:relative;font-family:"PT Sans Narrow","Arial Narrow",Arial,sans-serif;font-size:3.1mm;line-height:1.1;page-break-after:always;overflow:hidden}
.sheet .frm{position:absolute;left:19.5mm;top:4.5mm;right:4.5mm;bottom:4.5mm;border:0.5mm solid #111;display:flex;flex-direction:column}
.sheet table{border-collapse:collapse;width:100%;table-layout:fixed}
.sheet td{border:0.25mm solid #111;padding:0 1mm;height:5mm;vertical-align:middle;overflow:hidden;white-space:nowrap;text-overflow:clip}
.sheet td.l{font-size:2.4mm;color:#222}
.sheet td.c{text-align:center}
.sheet td.big{font-size:4.2mm;font-weight:700;text-align:center;white-space:normal}
.sheet .gap{height:2mm;flex:none}
.sheet .hdr td{font-size:2.3mm;text-align:center;height:4mm;white-space:normal;line-height:1}
.sheet .rows td{height:7.6mm;font-size:3.2mm}
.sheet .rows td.sym{text-align:center;font-weight:700;font-size:2.9mm}
.sheet .foot{margin-top:auto;display:flex;justify-content:flex-end;flex:none}
.sheet .foot table{width:auto}
.sheet .foot td{height:6mm;min-width:16mm;text-align:center;font-weight:700;font-size:3.6mm}
.sheet .gost{position:absolute;left:21mm;top:0.8mm;font-size:2.5mm}
.sheet .stub{position:absolute;left:5mm;bottom:5mm;width:12mm;height:120mm;border:0.25mm solid #111;writing-mode:vertical-rl;transform:rotate(180deg);font-size:2.3mm;display:flex;justify-content:space-around;align-items:center}
.sheet .pic{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:2mm 3mm;gap:1.5mm}
.sheet .pic.fixed{flex:none}
.sheet .pic .cap{font-weight:700;font-size:3.6mm;text-align:center}
.sheet .pic .box{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.sheet .pic img{max-width:100%;max-height:100%;object-fit:contain}
.sheet .pic .nofig{color:#777;font-size:3.4mm}
.sheet .pic .note{font-size:3.2mm;white-space:pre-wrap}
.sheet .txt-lines{padding:2mm 4mm;display:flex;flex-direction:column}
.sheet .txt-lines div{height:6mm;line-height:6mm;font-size:3.5mm;white-space:nowrap;border-bottom:0.15mm solid #bbb}
.sheet .txt-lines div.h{font-weight:700}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Техкарты ЕСТД <small>v3.0</small></div>
    <select class="sel" id="cardSel" aria-label="Выбор детали"></select>
    <button class="btn" id="bNew">Новая</button>
    <button class="btn" id="bDup">Копия</button>
    <button class="btn danger" id="bDel">Удалить</button>
    <span class="grow"></span>
    <label class="btn" for="fileIn" style="margin:0">Открыть файл…</label>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <button class="btn" id="bSave">Сохранить файл</button>
  </div>
</header>

<main class="wrap">
  <section class="pane" aria-label="Редактор">
    <div class="pane-h">
      <div class="tabs" role="group" aria-label="Раздел" id="edTabs">
        <button data-tab="imp">Из 3D-модели</button>
        <button data-tab="doc">Деталь</button>
        <button data-tab="ops">Операции</button>
        <button data-tab="group">Группа</button>
        <button data-tab="sk">Эскизы</button>
        <button data-tab="kit">Комплект</button>
        <button data-tab="ti">Инструкция</button>
      </div>
    </div>
    <div class="pane-b" id="editor"></div>
  </section>

  <section class="pane" aria-label="Бланк">
    <div class="pane-h">
      <select class="sel" id="kindSel" aria-label="Документ"></select>
      <select class="sel" id="opSel" aria-label="Операция" hidden></select>
      <select class="sel" id="vidSel" aria-label="Вид работ" hidden></select>
      <span class="grow"></span>
      <button class="btn" id="bAll">Печать комплекта</button>
      <button class="btn primary" id="bPrint">Печать / PDF</button>
    </div>
    <div class="prev-wrap" id="prevWrap"><div class="doc-note" id="docNote"></div><div class="sheets" id="sheets"></div></div>
  </section>
</main>
<div class="toast" id="toast" hidden></div>
<input type="file" id="imgIn" accept="image/*" hidden>

<datalist id="dlOps">
  <option value="Заготовительная"><option value="Отрезная"><option value="Фрезерно-центровальная"><option value="Токарная"><option value="Токарная с ЧПУ"><option value="Токарно-винторезная"><option value="Фрезерная"><option value="Вертикально-фрезерная"><option value="Горизонтально-фрезерная"><option value="Сверлильная"><option value="Зубофрезерная"><option value="Протяжная"><option value="Круглошлифовальная"><option value="Плоскошлифовальная"><option value="Термическая"><option value="Слесарная"><option value="Моечная"><option value="Сборочная"><option value="Контрольная">
</datalist>
<datalist id="dlEq">
  <option value="Токарно-винторезный станок 16К20"><option value="Токарный станок с ЧПУ 16К20Ф3"><option value="Фрезерно-центровальный станок МР-71М"><option value="Вертикально-фрезерный станок 6Р12"><option value="Горизонтально-фрезерный станок 6Р82"><option value="Вертикально-сверлильный станок 2Н135"><option value="Радиально-сверлильный станок 2М55"><option value="Зубофрезерный станок 5К301П"><option value="Круглошлифовальный станок 3М151"><option value="Плоскошлифовальный станок 3Г71"><option value="Ленточнопильный станок"><option value="Верстак слесарный"><option value="Пресс гидравлический"><option value="Стол ОТК">
</datalist>
<datalist id="dlVid">
  <option value="Механическая обработка"><option value="Заготовительная"><option value="Термическая обработка"><option value="Слесарная"><option value="Сборка"><option value="Контроль">
</datalist>

<script>
(function(){
const LS="techkarta.local.v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const num=v=>{const x=parseFloat(String(v??"").replace(",","."));return isFinite(x)?x:null};
const fmt=(x,d)=>x==null?"":(Math.round(x*10**d)/10**d).toString().replace(".",",");
const lines=s=>String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
const pipes=s=>lines(s).map(l=>l.split("|").map(x=>x.trim()));

/* ---------- данные ---------- */
const blankTr=()=>({text:"",tools:"",pi:"",D:"",L:"",t:"",i:"1",S:"",n:"",V:""});
const blankOp=()=>({num:"",vid:"Механическая обработка",cex:"",uch:"",rm:"",code:"",name:"",doc:"",eq:"",sm:"",prof:"",r:"",ut:"",kr:"1",koid:"1",en:"",op:"",ksht:"",tpz:"",tsht:"",tv:"",soj:"",fixt:"",meas:"",setup:"",img:"",imgCap:"",var:"",tr:[blankTr()],open:true});
const TPL={
  group:()=>({oboz:"",name:"",mat:"",md:"",prog:""}),
  sk:()=>({title:"",note:"",img:""}),
  kit:()=>({oboz:"",name:"",src:"",qty:"1",ev:"шт",qtyk:"",note:""}),
  ti:()=>({title:"",text:""})
};
function blankCard(){return normalize({id:uid(),h:{org:"",oboz:"",name:"Новая деталь",mat:"",matCode:"",ev:"кг",md:"",en:"1",nrash:"",kim:"",zagCode:"",zagProf:"",kd:"1",mz:"",tv:"",razr:"",prov:"",utv:"",nkontr:"",date:"",grpName:"",grpOboz:"",kitName:"",kitOboz:"",tiName:""},ops:[blankOp()]})}
function normalize(c){
  c.h=Object.assign({grpName:"",grpOboz:"",kitName:"",kitOboz:"",tiName:""},c.h||{});
  ["group","sk","kit","ti"].forEach(k=>{if(!Array.isArray(c[k]))c[k]=[]});
  c.ops=(c.ops||[]).map(o=>{const b=blankOp();o=Object.assign(b,o);o.tr=(o.tr&&o.tr.length?o.tr:[blankTr()]).map(t=>Object.assign(blankTr(),t));return o});
  return c;
}

/* эскиз вала для примера — рисуется на холсте */
function sampleSketch(){
  try{
    const W=1400,H=620,cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
    g.fillStyle="#fff";g.fillRect(0,0,W,H);g.strokeStyle="#111";g.fillStyle="#111";g.lineWidth=3;
    const s=4.2,x0=110,cy=300;
    const steps=[[40,50],[46,30],[52,10],[46,78],[40,48],[34,34]];
    let x=x0;g.beginPath();
    steps.forEach(([d,l],i)=>{const r=d*s/2,w=l*s;if(i===0){g.moveTo(x,cy-r)}else g.lineTo(x,cy-r);g.lineTo(x+w,cy-r);x+=w});
    g.lineTo(x,cy);x=x0;
    g.moveTo(x,cy+steps[0][0]*s/2);
    steps.forEach(([d,l])=>{const r=d*s/2,w=l*s;g.lineTo(x,cy+r);g.lineTo(x+w,cy+r);x+=w});g.lineTo(x,cy);g.stroke();
    x=x0;g.lineWidth=1.5;steps.forEach(([d,l])=>{const r=d*s/2;g.beginPath();g.moveTo(x,cy-r);g.lineTo(x,cy+r);g.stroke();x+=l*s});
    g.beginPath();g.moveTo(x,cy-steps[5][0]*s/2);g.lineTo(x,cy+steps[5][0]*s/2);g.stroke();
    g.setLineDash([28,8,4,8]);g.lineWidth=1.2;g.beginPath();g.moveTo(x0-40,cy);g.lineTo(x+40,cy);g.stroke();g.setLineDash([]);
    // шпоночный паз
    const kx=x0+(50+30+10+14)*s;g.lineWidth=2;g.strokeRect(kx,cy-6*s,50*s,12*s);
    g.font="bold 30px Arial";g.textAlign="center";
    x=x0;const lab=["Ø40k6","Ø46","Ø52","Ø46h9","Ø40k6","Ø34n6"];
    steps.forEach(([d,l],i)=>{const r=d*s/2;g.fillText(lab[i],x+l*s/2,cy-r-18);x+=l*s});
    g.font="26px Arial";
    // общий размер
    g.lineWidth=1.5;const yb=cy+130;g.beginPath();g.moveTo(x0,yb);g.lineTo(x,yb);g.moveTo(x0,cy+60);g.lineTo(x0,yb+12);g.moveTo(x,cy+60);g.lineTo(x,yb+12);g.stroke();
    const arr=(ax,dir)=>{g.beginPath();g.moveTo(ax,yb);g.lineTo(ax+dir*18,yb-6);g.lineTo(ax+dir*18,yb+6);g.closePath();g.fill()};arr(x0,1);arr(x,-1);
    g.fillText("250-0,46",(x0+x)/2,yb-10);
    g.fillText("12N9",kx+25*s,cy+6*s+36);
    g.font="24px Arial";g.textAlign="left";g.fillText("Ra 0,8 — поверхности Ø40k6, Ø34n6; остальные Ra 6,3",x0,H-40);
    return cv.toDataURL("image/jpeg",0.85);
  }catch(e){return""}
}

function sample(){
  const c=blankCard();
  Object.assign(c.h,{org:"Кафедра «Детали машин»",oboz:"КП.ДМ.02.01.003",name:"Вал тихоходный",mat:"Сталь 45 ГОСТ 1050-2013",ev:"кг",md:"2,9",en:"1",nrash:"4,1",kim:"",zagProf:"Круг 50 ГОСТ 2590-2006",kd:"1",mz:"4,1",tv:"HB 235…262",razr:"Иванов",prov:"Петров",nkontr:"Сидоров",date:"27.10.2026",
    grpName:"Валы ступенчатые Ø34…Ø52, L до 300",grpOboz:"ТП.ВАЛ.01",kitName:"Вал тихоходный в сборе",kitOboz:"КП.ДМ.02.01.000",tiName:"Общие требования к механической обработке валов"});
  const T=o=>Object.assign(blankTr(),o),O=o=>Object.assign(blankOp(),o);
  c.ops=[

let S={cards:[],cur:null,kind:"mk",okOp:0,vid:"",tab:"doc"};
function load(){try{const r=JSON.parse(localStorage.getItem(LS)||"null");if(r&&Array.isArray(r.cards)&&r.cards.length){S=Object.assign(S,r)}}catch(e){}
  S.cards=S.cards.map(normalize);
  if(!S.cards.length){const c=sample();S.cards=[c];S.cur=c.id}
  if(!S.cards.find(c=>c.id===S.cur))S.cur=S.cards[0].id;
  if(S.tab==="doc"||!S.tab)S.tab="doc";}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast("В браузере не хватает места. Сохраните карту в файл или уменьшите число эскизов")}},300)}
const card=()=>S.cards.find(c=>c.id===S.cur);

/* ---------- расчёт ---------- */
function calcN(tr){const D=num(tr.D),V=num(tr.V);return D&&V?Math.round(1000*V/(Math.PI*D)):null}
function nVal(tr){return num(tr.n)??calcN(tr)}
function toVal(tr){const L=num(tr.L),S=num(tr.S),n=nVal(tr),i=num(tr.i)??1;return L&&S&&n?L*i/(S*n):null}
function opTo(op){let s=0,any=false;op.tr.forEach(t=>{const v=toVal(t);if(v!=null){s+=v;any=true}});return any?s:null}
function autoTsht(op){const to=opTo(op),tv=num(op.tv);if(to==null&&tv==null)return"";return fmt(((to||0)+(tv||0))*1.08,2)}
const tshtVal=op=>op.tsht||autoTsht(op);
function autoKim(h){const a=num(h.md),b=num(h.mz);return a&&b?fmt(a/b,2):""}

let tT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,3000)}

      ${F(k+".n","n, об/мин",t.n,{num:1,ph:n!=null?String(n):"",mono:1})}
      <label class="f">To, мин<input class="calc" readonly tabindex="-1" value="${to!=null?fmt(to,3):"—"}" data-to="${oi}.${ti}"></label>
    </div>
  </div>`}

/* ---------- бланки: колонки (ширины в мм, сумма 262) ---------- */

  V:[["№",12],["Обозначение детали",70],["D или B",30],["L",30],["Тшт, мин",30],["Наименование",90]],

const HLAB={X:{О:"Содержание перехода",Т:"Информация об оснастке и инструменте",o:"Содержание операции"}};
const SYMW=10;
function wrapText(s,max){const out=[];String(s||"").split("\n").forEach(par=>{let line="";par.split(/\s+/).filter(Boolean).forEach(w=>{if((line+" "+w).trim().length>max){if(line)out.push(line);line=w}else line=(line+" "+w).trim()});if(line)out.push(line)});return out}
function colgroup(arr){return"<colgroup><col style='width:"+SYMW+"mm'>"+arr.map(a=>`<col style="width:${a[1]}mm">`).join("")+"</colgroup>"}
function rowHTML(r,idx){
  const cols=COL[r.type],no=r.sym+String(idx).padStart(2,"0");
  return`<table>${colgroup(cols)}<tr class="rows"><td class="sym">${no}</td>${r.cells.map((v,i)=>`<td class="${r.type==="X"?"":(cols[i][1]>=48?"":"c")}">${esc(v)}</td>`).join("")}</tr></table>`}
function emptyRow(idx){return`<table>${colgroup(COL.X)}<tr class="rows"><td class="sym">${String(idx).padStart(2,"0")}</td><td></td></tr></table>`}
function hdr(sym,type,label){const arr=type==="X"?[[label,262]]:COL[type];
  return`<table class="hdr">${colgroup(arr)}<tr><td><b>${sym}</b></td>${arr.map(a=>`<td>${esc(a[0])}</td>`).join("")}</tr></table>`}
const HDR={
  route:[["А","A"],["Б","B"],["О","X","Содержание операции"],["Т","X","Информация об оснастке"]],
  full:[["А","A"],["Б","B"],["О","X","Содержание перехода"],["Т","X","Информация об оснастке и инструменте"],["Р","R"]],
  op:[["О","X","Содержание перехода"],["Т","X","Информация об оснастке и инструменте"],["Р","R"]]
};

/* строки по операциям */
function opRows(op,mode){
  const R=[],push=(sym,type,cells)=>R.push({sym,type,cells});
  if(mode!=="op"){
    push("А","A",[op.cex,op.uch,op.rm,op.num,[op.code,op.name].filter(Boolean).join(" "),op.doc]);
    push("Б","B",[op.eq,op.sm,op.prof,op.r,op.ut,op.kr,op.koid,op.en,op.op,op.ksht,op.tpz,tshtVal(op)]);
  }
  if(mode==="route"){
    const txt=op.tr.map(t=>t.text).filter(Boolean);
    if(txt.length===1)wrapText(txt[0],150).forEach(l=>push("О","X",[l]));
    if(op.fixt)wrapText(op.fixt,150).forEach(l=>push("Т","X",[l]));
    return R;
  }
  if(op.fixt)wrapText(op.fixt,150).forEach(l=>push("Т","X",[l]));
  op.tr.forEach((t,ti)=>{
    wrapText((ti+1)+". "+(t.text||""),150).forEach(l=>push("О","X",[l]));
    lines(t.tools).forEach(tl=>wrapText(tl,150).forEach(l=>push("Т","X",[l])));
    const n=nVal(t);
    if([t.D,t.L,t.t,t.S,t.V,t.pi].some(v=>String(v||"").trim()))push("Р","R",[t.pi,t.D,t.L,t.t,t.i,t.S,n!=null?String(n):"",t.V]);
  });
  lines(op.meas).forEach(m=>wrapText(m,150).forEach(l=>push("Т","X",[l])));
  return R;
}

const TBH={mat:63,op:79,none:42,small:12,kit:42};

     <table class="hdr">${colgroup(COL.B)}<tr><td></td>${COL.B.map(a=>`<td>${a[0]}</td>`).join("")}</tr></table>
     <table>${colgroup(COL.B)}<tr class="rows"><td class="sym">Б02</td><td>${esc(op.eq)}</td>${[op.sm,op.prof,op.r,op.ut,op.kr,op.koid,op.en,op.op,op.ksht,op.tpz,tshtVal(op)].map(v=>`<td class="c">${esc(v)}</td>`).join("")}</tr></table>
     <table class="hdr">${cg([80,40,20,20,22,22,58])}<tr><td></td><td>Материал</td><td>Твёрдость</td><td>ЕВ</td><td>МД</td><td>То, мин</td><td>Тв, мин</td><td>СОЖ</td></tr></table>
     <table>${cg([80,40,20,20,22,22,58])}<tr class="rows"><td class="sym">М03</td><td>${esc(h.mat)}</td><td class="c">${esc(h.tv)}</td><td class="c">${esc(h.ev)}</td><td class="c">${esc(h.md)}</td><td class="c">${fmt(to,2)}</td><td class="c">${esc(op.tv)}</td><td>${esc(op.soj)}</td></tr></table>
     <div class="gap"></div>`;
  }else if(mode==="mat"){
    const cg=colgroup([24,14,18,14,20,16,24,92,14,26].map(w=>["",w]));
    s+=`<table>${colgroup(COL.X)}<tr class="rows"><td class="sym">М01</td><td>${esc(h.mat)}</td></tr></table>
    <table class="hdr">${cg}<tr><td></td><td>Код</td><td>ЕВ</td><td>МД</td><td>ЕН</td><td>Н. расх.</td><td>КИМ</td><td>Код загот.</td><td>Профиль и размеры</td><td>КД</td><td>МЗ</td></tr></table>
    <table>${cg}<tr class="rows"><td class="sym">М02</td>${[h.matCode,h.ev,h.md,h.en,h.nrash,kim,h.zagCode,h.zagProf,h.kd,h.mz].map(v=>`<td class="c">${esc(v)}</td>`).join("")}</tr></table>

function smallTitle(c,o){
  return`<table><colgroup><col><col style="width:62mm"><col style="width:14mm"><col style="width:12mm"></colgroup>
   <tr><td class="big" rowspan="2">${esc(o.name??c.h.name)}</td><td class="big" rowspan="2">${esc(o.oboz??c.h.oboz)}</td><td class="l c">Лист</td><td></td></tr>
   <tr><td class="c" colspan="2">${o.sheet}</td></tr></table><div class="gap"></div>`}
function frame(form,code,inner,sheet){
  return`<div class="sheet"><div class="gost">${esc(form)}</div>
    <div class="stub"><span>Инв. № подл.</span><span>Подп. и дата</span><span>Взам. инв. №</span></div>
    <div class="frm">${inner}<div class="foot"><table><tr><td>${esc(code)}</td><td>${sheet}</td></tr></table></div></div></div>`}

/* общий постраничный вывод табличного документа */
function paged(c,d,{mode,op,heads,rows,rowStart=1,name,oboz,center,before="",beforeH=0}){
  const hh=heads.length*4;
  const cap1=Math.max(1,Math.floor((200-TBH[mode]-hh-beforeH-9)/7.6)),capN=Math.floor((200-TBH.small-hh-9)/7.6);
  const pages=[rows.slice(0,cap1)];for(let i=cap1;i<rows.length;i+=capN)pages.push(rows.slice(i,i+capN));
  let rn=rowStart;const total=pages.length,o={op,name,oboz,center,total};
  const H=heads.map(x=>hdr(x[0],x[1],x[2])).join("");
  return pages.map((pg,pi)=>{
    const cap=pi===0?cap1:capN;let body="";
    for(let k=0;k<cap;k++){const r=pg[k];body+=r?rowHTML(r,rn):emptyRow(rn);rn++}
    o.sheet=pi+1;
    const top=pi===0?titleBlock(c,mode,o)+before:smallTitle(c,o);
    return frame(d.form[pi===0?0:1],d.code,top+H+body,pi+1);
  });
}
function picBlock(img,cap,note,fixedH){
  return`<div class="pic${fixedH?" fixed":""}"${fixedH?` style="height:${fixedH}mm"`:""}>${cap?`<div class="cap">${esc(cap)}</div>`:""}
   <div class="box">${img?`<img src="${img}" alt="">`:`<span class="nofig">Изображение не загружено</span>`}</div>${note?`<div class="note">${esc(note)}</div>`:""}</div>`}

/* ---------- описание документов ---------- */
const DOCS={
  mk:{code:"МК",title:"Маршрутная карта",form:["ГОСТ 3.1118-82 Форма 1","ГОСТ 3.1118-82 Форма 1б"],note:"Весь путь детали по цехам и операциям: строки А, Б, кратко О и Т."},
  mok:{code:"МК",title:"Маршрутно-операционная карта",form:["ГОСТ 3.1118-82 Форма 1","ГОСТ 3.1118-82 Форма 1б"],note:"Маршрут с полным описанием переходов, инструмента и режимов."},
  ok:{code:"ОК",title:"Операционная карта",form:["ГОСТ 3.1404-86 Форма 3","ГОСТ 3.1404-86 Форма 2а"],perOp:1,note:"Подробное описание одной операции: переходы, режимы, инструмент."},
  ktp:{code:"КТП",title:"Карта технологического процесса",form:["ГОСТ 3.1404-86 Форма 1","ГОСТ 3.1404-86 Форма 1б"],byVid:1,note:"Все операции одного вида работ с переходами и режимами."},
  ke:{code:"КЭ",title:"Карта эскизов",form:["ГОСТ 3.1105-2011 Форма 7","ГОСТ 3.1105-2011 Форма 7а"],note:"Эскизы из раздела «Эскизы» и операционные эскизы — по листу на каждый."},
  kttp:{code:"КТТП",title:"Карта типового (группового) технологического процесса",form:["ГОСТ 3.1121-84 Форма 1","ГОСТ 3.1121-84 Форма 1б"],note:"Состав группы деталей, общий маршрут и Тшт по каждой детали."},
  kto:{code:"КТО",title:"Карта типовой (групповой) операции",form:["ГОСТ 3.1121-84 Форма 2","ГОСТ 3.1121-84 Форма 2а"],perOp:1,note:"Общая операция для группы и переменные данные по деталям."},
  kk:{code:"КК",title:"Комплектовочная карта",form:["ГОСТ 3.1123-84 Форма 1","ГОСТ 3.1123-84 Форма 1а"],note:"Детали и покупные изделия, нужные для сборки."},
  kn:{code:"КН",title:"Карта наладки",form:["ГОСТ 3.1404-86 Форма 4","ГОСТ 3.1404-86 Форма 4а"],perOp:1,note:"Схема наладки и наладочные размеры оборудования для операции."},
  ti:{code:"ТИ",title:"Технологическая инструкция",form:["ГОСТ 3.1105-2011 Форма 5","ГОСТ 3.1105-2011 Форма 5а"],note:"Повторяющиеся приёмы и правила в виде текста."},
  vop:{code:"ВОП",title:"Ведомость операций",form:["ГОСТ 3.1122-84 Форма 1","ГОСТ 3.1122-84 Форма 1а"],note:"Сводка всех операций: оборудование, приспособления, нормы. Собирается автоматически."},
  vo:{code:"ВО",title:"Ведомость оснастки",form:["ГОСТ 3.1122-84 Форма 4","ГОСТ 3.1122-84 Форма 4а"],note:"Вся оснастка, инструмент и средства измерения без повторов, с номерами операций. Собирается автоматически."}
};
const ORDER=["mk","mok","ok","ktp","ke","kttp","kto","kk","kn","ti","vop","vo"];
function vids(c){return[...new Set(c.ops.map(o=>o.vid||"Без вида работ"))]}

function build(c,kind,arg){
  const d=DOCS[kind];
  if(kind==="mk"||kind==="mok"){
    if(!c.ops.length)return[];
    const mode=kind==="mk"?"route":"full";
    return paged(c,d,{mode:"mat",heads:HDR[mode],rows:c.ops.flatMap(o=>opRows(o,mode)),rowStart:3});
  }
  if(kind==="ok"){const op=c.ops[arg];if(!op)return[];return paged(c,d,{mode:"op",op,heads:HDR.op,rows:opRows(op,"op"),rowStart:4})}
  if(kind==="ktp"){
    const v=arg||vids(c)[0];const ops=c.ops.filter(o=>(o.vid||"Без вида работ")===v);if(!ops.length)return[];
    return paged(c,d,{mode:"mat",heads:HDR.full,rows:ops.flatMap(o=>opRows(o,"full")),rowStart:3,center:v});
  }
  if(kind==="ke"){
    const list=c.sk.map(s=>({img:s.img,cap:s.title,note:s.note})).concat(c.ops.filter(o=>o.img).map(o=>({img:o.img,cap:o.imgCap||`Эскиз к операции ${o.num} ${o.name}`,note:""})));
    if(!list.length)return[];
    return list.map((p,i)=>{const o={sheet:i+1,total:list.length};
      return frame(d.form[i?1:0],d.code,(i===0?titleBlock(c,"none",o):smallTitle(c,o))+picBlock(p.img,p.cap,p.note),i+1)});
  }
  if(kind==="kttp"){
    if(!c.group.length)return[];
    const rows=c.group.map((g,i)=>({sym:"",type:"D",cells:[i+1,g.oboz,g.name,g.mat,g.md,g.prog]}));
    c.ops.forEach(o=>{opRows(o,"route").filter(r=>r.sym==="А"||r.sym==="Б").forEach(r=>rows.push(r));
      const ts=pipes(o.var).map(p=>p[2]||"");if(ts.some(Boolean))rows.push({sym:"",type:"G",cells:["Тшт по деталям, мин"].concat(ts.slice(0,8))})});
    return paged(c,d,{mode:"mat",heads:[["","D"],["А","A"],["Б","B"],["","G"]],rows,rowStart:3,name:c.h.grpName||c.h.name,oboz:c.h.grpOboz||c.h.oboz});
  }
  if(kind==="kto"){
    const op=c.ops[arg];if(!op||!c.group.length)return[];
    const rows=opRows(op,"op"),vs=pipes(op.var);
    c.group.forEach((g,i)=>{const v=vs[i]||[];rows.push({sym:"",type:"V",cells:[i+1,g.oboz,v[0]||"",v[1]||"",v[2]||"",g.name]})});
    return paged(c,d,{mode:"op",op,heads:HDR.op.concat([["","V"]]),rows,rowStart:4,name:c.h.grpName||c.h.name,oboz:c.h.grpOboz||c.h.oboz});
  }
  if(kind==="kk"){
    if(!c.kit.length)return[];
    return paged(c,d,{mode:"none",heads:[["","KK"]],rows:c.kit.map(k=>({sym:"",type:"KK",cells:[k.oboz,k.name,k.src,k.qty,k.ev,k.qtyk,k.note]})),name:c.h.kitName||c.h.name,oboz:c.h.kitOboz||c.h.oboz});
  }
  if(kind==="kn"){
    const op=c.ops[arg];if(!op)return[];
    const rows=pipes(op.setup).map(p=>({sym:"",type:"KN",cells:[p[0]||"",p[1]||"",p[2]||"",p[3]||""]}));
    if(!rows.length&&!op.img)return[];
    const picH=op.img?62:0;
    return paged(c,d,{mode:"op",op,heads:[["","KN"]],rows,rowStart:4,before:op.img?picBlock(op.img,op.imgCap||"Схема наладки","",picH):"",beforeH:picH});
  }
  if(kind==="ti"){
    if(!c.ti.length)return[];
    const L=[];c.ti.forEach(s=>{if(s.title)L.push({h:1,t:s.title});wrapText(s.text,150).forEach(t=>L.push({t}));L.push({t:""})});
    const cap1=Math.floor((200-TBH.none-9)/6)-1,capN=Math.floor((200-TBH.small-9)/6)-1;
    const pages=[L.slice(0,cap1)];for(let i=cap1;i<L.length;i+=capN)pages.push(L.slice(i,i+capN));
    return pages.map((pg,pi)=>{const o={sheet:pi+1,total:pages.length,name:c.h.tiName||"Технологическая инструкция",center:c.h.name};
      return frame(d.form[pi?1:0],d.code,(pi===0?titleBlock(c,"none",o):smallTitle(c,o))+`<div class="txt-lines">${pg.map(x=>`<div class="${x.h?"h":""}">${esc(x.t)}</div>`).join("")}</div>`,pi+1)});
  }
  if(kind==="vop"){
    if(!c.ops.length)return[];
    return paged(c,d,{mode:"mat",heads:[["","VOP"]],rows:c.ops.map(o=>({sym:"",type:"VOP",cells:[o.num,o.name,o.eq,o.fixt,o.r,o.tpz,tshtVal(o)]})),rowStart:3});
  }
  if(kind==="vo"){
    const m=new Map(),add=(name,type,opn)=>{name=name.trim();if(!name)return;const k=name.toLowerCase();if(!m.has(k))m.set(k,{name,type,ops:new Set()});m.get(k).ops.add(opn)};
    c.ops.forEach(o=>{o.fixt.split(/,\s*(?=[А-ЯЁA-Z])/).forEach(f=>add(f,"Приспособление",o.num));
      o.tr.forEach(t=>lines(t.tools).forEach(x=>add(x,"Режущий инструмент",o.num)));
      lines(o.meas).forEach(x=>add(x,"Средство измерения",o.num))});
    const order={"Приспособление":0,"Режущий инструмент":1,"Средство измерения":2};
    const items=[...m.values()].sort((a,b)=>order[a.type]-order[b.type]);
    if(!items.length)return[];
    const rows=[];items.forEach(it=>{const w=wrapText(it.name,88);w.forEach((l,i)=>rows.push({sym:"",type:"VO",cells:[l,i?"":it.type,i?"":[...it.ops].join(", "),""]}))});
    return paged(c,d,{mode:"mat",heads:[["","VO"]],rows,rowStart:3});
  }
  return[];
}

const V3={sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],

/* ---------- STL ---------- */
function parseSTL(buf){
  const dv=new DataView(buf);
  if(buf.byteLength>=84){const n=dv.getUint32(80,true);if(n>0&&84+n*50===buf.byteLength){const P=new Float64Array(n*9);
    for(let i=0;i<n;i++){const o=84+i*50+12;for(let k=0;k<9;k++)P[i*9+k]=dv.getFloat32(o+k*4,true)}return P}}
  const txt=new TextDecoder().decode(buf),re=/vertex\s+([-+\d.eE]+)\s+([-+\d.eE]+)\s+([-+\d.eE]+)/g,a=[];let m;
  while((m=re.exec(txt)))a.push(+m[1],+m[2],+m[3]);
  if(!a.length||a.length%9)throw new Error("Не удалось прочитать STL: файл повреждён или это не STL");
  return Float64Array.from(a);
}
function eig3(C){ // Якоби для симметричной 3×3
  const A=C.map(r=>r.slice()),V=[[1,0,0],[0,1,0],[0,0,1]];
  for(let it=0;it<50;it++){let p=0,q=1;if(Math.abs(A[0][2])>Math.abs(A[p][q])){p=0;q=2}if(Math.abs(A[1][2])>Math.abs(A[p][q])){p=1;q=2}
    if(Math.abs(A[p][q])<1e-12)break;const th=(A[q][q]-A[p][p])/(2*A[p][q]),t=Math.sign(th||1)/(Math.abs(th)+Math.sqrt(th*th+1)),c=1/Math.sqrt(t*t+1),s=t*c;
    for(let k=0;k<3;k++){const akp=A[k][p],akq=A[k][q];A[k][p]=c*akp-s*akq;A[k][q]=s*akp+c*akq}
    for(let k=0;k<3;k++){const apk=A[p][k],aqk=A[q][k];A[p][k]=c*apk-s*aqk;A[q][k]=s*apk+c*aqk}
    for(let k=0;k<3;k++){const vkp=V[k][p],vkq=V[k][q];V[k][p]=c*vkp-s*vkq;V[k][q]=s*vkp+c*vkq}}

}
function triInfo(P,i,F){

  const N=V3.cross(V3.sub(p[1],p[0]),V3.sub(p[2],p[0])),ar=Math.hypot(...N)/2;if(ar<1e-9)return null;

function analyzeSTL(buf,fname){

  for(let i=0;i<P.length;i+=3)for(let k=0;k<3;k++){if(P[i+k]<mn[k])mn[k]=P[i+k];if(P[i+k]>mx[k])mx[k]=P[i+k]}
  const dim=Math.max(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]);
  let unit="мм";if(dim<2){for(let i=0;i<P.length;i++)P[i]*=1000;mn=mn.map(x=>x*1000);mx=mx.map(x=>x*1000);unit="м → мм"}
  // ковариация центров треугольников
  let sw=0,m=[0,0,0];const C=[[0,0,0],[0,0,0],[0,0,0]],cs=[];
  for(let i=0;i<P.length;i+=9){const a=[P[i],P[i+1],P[i+2]],b=[P[i+3],P[i+4],P[i+5]],c=[P[i+6],P[i+7],P[i+8]];
    const ar=Math.hypot(...V3.cross(V3.sub(b,a),V3.sub(c,a)))/2,ce=V3.mul(V3.add(V3.add(a,b),c),1/3);cs.push([ce,ar]);sw+=ar;m=V3.add(m,V3.mul(ce,ar))}

    for(let i=0;i<P.length;i+=3){const q=[P[i],P[i+1],P[i+2]],u=V3.dot(q,f0.u),v=V3.dot(q,f0.v);if(u<umin)umin=u;if(u>umax)umax=u;if(v<vmin)vmin=v;if(v>vmax)vmax=v}
    const p0=V3.add(V3.mul(f0.u,(umin+umax)/2),V3.mul(f0.v,(vmin+vmax)/2)),F=mkFrame(p0,a);

    if(t.t==="cyl")segs.push({r:t.r,x0:t.x0,x1:t.x1,inner:t.inner,ar:t.ar});
    else if(t.t==="cone")cones.push({x0:t.x0,x1:t.x1,r0:t.r0,r1:t.r1,inner:t.inner});
    else if(t.t==="f"){const c=t.L.reduce((a,l)=>({x:a.x+l.x/3,y:a.y+l.r*Math.cos(l.th)/3,z:a.z+l.r*Math.sin(l.th)/3}),{x:0,y:0,z:0});

/* ---------- эскиз ---------- */
function drawPart(A,{w=1400,h=600,bg="#fff",ink="#111",acc="#1f5fa8",labels=true}={}){
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;const g=cv.getContext("2d");
  g.fillStyle=bg;g.fillRect(0,0,w,h);
  const S=A.steps,Dm=Math.max(...S.map(s=>s.D)),pad=110,sc=Math.min((w-2*pad)/A.L,(h-260)/Dm),x0=(w-A.L*sc)/2,cy=h/2-10;
  const X=x=>x0+x*sc,Y=r=>cy-r*sc;
  g.lineWidth=2.5;g.strokeStyle=ink;
  // контур
  const prof=S.map(s=>({a:X(s.x0),b:X(s.x1),r0:s.cone?s.cone.d0/2:s.D/2,r1:s.cone?s.cone.d1/2:s.D/2}));
  const ch=A.chams;
  for(const sgn of[1,-1]){g.beginPath();prof.forEach((p,i)=>{const ya=cy-sgn*p.r0*sc,yb=cy-sgn*p.r1*sc;if(i===0)g.moveTo(p.a,cy);g.lineTo(p.a,ya);g.lineTo(p.b,yb)});g.lineTo(prof[prof.length-1].b,cy);g.stroke()}
  g.lineWidth=1.2;S.forEach((s,i)=>{if(i){const p=S[i-1];g.beginPath();g.moveTo(X(s.x0),Y(Math.min(p.D,s.D)/2));g.lineTo(X(s.x0),Y(-Math.min(p.D,s.D)/2));g.stroke()}});
  // фаски
  g.lineWidth=1.2;ch.forEach(c=>{const s=S[c.step];if(!s)return;const xx=X(c.x),r=(c.D/2-c.c)*sc;g.beginPath();g.moveTo(xx,cy-r);g.lineTo(xx,cy+r);g.stroke()});
  // отверстия по оси
  g.setLineDash([10,6]);A.bores.forEach(b=>{g.strokeRect(X(b.x0),Y(b.d/2),(b.x1-b.x0)*sc,b.d*sc)});g.setLineDash([]);
  // ось
  g.setLineDash([26,7,4,7]);g.lineWidth=1;g.beginPath();g.moveTo(X(0)-40,cy);g.lineTo(X(A.L)+40,cy);g.stroke();g.setLineDash([]);
  // пазы
  g.lineWidth=2;A.keys.filter(k=>!k.internal).forEach(k=>{const r=k.b/2*sc,xa=X(k.x0),xb=X(k.x1);g.beginPath();g.moveTo(xa+r,cy-r);g.lineTo(xb-r,cy-r);g.arc(xb-r,cy,r,-Math.PI/2,Math.PI/2);g.lineTo(xa+r,cy+r);g.arc(xa+r,cy,r,Math.PI/2,Math.PI*1.5);g.stroke()});
  A.holes.forEach(hh=>{g.beginPath();g.arc(X(hh.x),cy,hh.d/2*sc,0,Math.PI*2);g.stroke()});
  A.flats.forEach(f=>{g.beginPath();g.moveTo(X(f.x0),Y(Rat(S,(f.x0+f.x1)/2)-f.t));g.lineTo(X(f.x1),Y(Rat(S,(f.x0+f.x1)/2)-f.t));g.stroke()});
  // венец — штрихпунктир делительного диаметра
  A.gears.forEach(gr=>{const d=(gr.Da-2*gr.m)/2*sc;g.setLineDash([18,5,3,5]);g.lineWidth=1;g.beginPath();g.moveTo(X(gr.x0)-8,cy-d);g.lineTo(X(gr.x1)+8,cy-d);g.moveTo(X(gr.x0)-8,cy+d);g.lineTo(X(gr.x1)+8,cy+d);g.stroke();g.setLineDash([])});
  if(!labels)return cv.toDataURL("image/png");
  // номера поверхностей и диаметры
  g.font="bold 26px Arial";g.textAlign="center";g.textBaseline="middle";
  S.forEach((s,i)=>{const xm=X((s.x0+s.x1)/2),yt=Y(s.D/2);
    g.strokeStyle=acc;g.fillStyle=acc;g.lineWidth=1.5;g.beginPath();g.moveTo(xm,yt);g.lineTo(xm,yt-38-(i%2)*34);g.stroke();
    g.beginPath();g.arc(xm,yt-56-(i%2)*34,17,0,Math.PI*2);g.fillStyle=bg;g.fill();g.stroke();g.fillStyle=acc;g.fillText(String(i+1),xm,yt-55-(i%2)*34);
    g.fillStyle=ink;g.font="22px Arial";const lbl=s.groove?`${nn(s.len)}×Ø${nn(s.D)}`:`Ø${nn(s.D)}${s.fit||""}`;
    g.save();g.translate(xm,Y(-s.D/2)+24+(i%2)*26);g.fillText(lbl,0,0);g.restore();g.font="bold 26px Arial"});
  // габаритный размер
  g.strokeStyle=ink;g.fillStyle=ink;g.lineWidth=1.3;const yb=h-55;
  g.beginPath();g.moveTo(X(0),Y(-S[0].D/2)+70);g.lineTo(X(0),yb+10);g.moveTo(X(A.L),Y(-S[S.length-1].D/2)+70);g.lineTo(X(A.L),yb+10);g.moveTo(X(0),yb);g.lineTo(X(A.L),yb);g.stroke();
  const ar=(x,d)=>{g.beginPath();g.moveTo(x,yb);g.lineTo(x+d*16,yb-5);g.lineTo(x+d*16,yb+5);g.closePath();g.fill()};ar(X(0),1);ar(X(A.L),-1);
  g.font="24px Arial";g.fillStyle=bg;const lt=`${nn(A.L)}`;const tw=g.measureText(lt).width+12;g.fillRect((X(0)+X(A.L))/2-tw/2,yb-16,tw,22);g.fillStyle=ink;g.fillText(lt,(X(0)+X(A.L))/2,yb-6);
  return cv.toDataURL("image/png");
}

function sampleSTL(){
  const prof=[[0,20],[2,20],[50,20],[50,23],[80,23],[80,26],[90,26],[90,23],[168,23],[168,20],[218,20],[218,17],[250,17]];
  const tris=[],N=96,pts=[];
  const ring=(x,r)=>{const a=[];for(let i=0;i<N;i++){const t=i/N*2*Math.PI;a.push([x,r*Math.cos(t),r*Math.sin(t)])}return a};
  const key={x0:104,x1:154,b:14,t:5.5,r:23};
  const inKey=(xa,xb,t0,t1)=>{const half=Math.asin(key.b/2/key.r)+0.02;return xb>key.x0-0.01&&xa<key.x1+0.01&&Math.min(Math.abs(t0-Math.PI/2),Math.abs(t1-Math.PI/2))<half+2*Math.PI/N};
  // фаски: торцы 1,6×45°
  const pr=[[0,18.4],[1.6,20],[50,20],[50,23],[80,23],[80,26],[90,26],[90,23],[166,23],[166,21],[170,21],[170,23],[168,23]];
  const P2=[[0,0],[0,18.4],[1.6,20],[50,20],[50,23],[80,23],[80,25],[81,26],[89,26],[90,25],[90,23],[166,23],[166,19.5],[169,19.5],[169,20],[218,20],[218,17],[248.4,17],[250,15.4],[250,0]];
  for(let k=0;k<P2.length-1;k++){const[xa,ra]=P2[k],[xb,rb]=P2[k+1];const A=ring(xa,ra),B=ring(xb,rb);
    for(let i=0;i<N;i++){const j=(i+1)%N,t0=i/N*2*Math.PI,t1=(i+1)/N*2*Math.PI;
      if(ra===rb&&Math.abs(ra-23)<0.01&&inKey(xa,xb,t0,t1)){ // разрез цилиндра пазом
        if(xa<key.x0){tris.push([A[i],ring(key.x0,ra)[j],A[j]],[A[i],ring(key.x0,ra)[i],ring(key.x0,ra)[j]])}
        if(xb>key.x1){tris.push([ring(key.x1,ra)[i],B[j],ring(key.x1,ra)[j]],[ring(key.x1,ra)[i],B[i],B[j]])}
        continue}
      tris.push([A[i],B[j],A[j]],[A[i],B[i],B[j]])}}
  // паз: дно и стенки
  const yb=key.r-key.t,hb=key.b/2,top=Math.sqrt(key.r*key.r-hb*hb);
  const q=(a,b,c,d)=>{tris.push([a,b,c],[a,c,d])};
  q([key.x0,-hb,yb],[key.x1,-hb,yb],[key.x1,hb,yb],[key.x0,hb,yb]);
  q([key.x0,-hb,yb],[key.x0,-hb,top],[key.x1,-hb,top],[key.x1,-hb,yb]);
  q([key.x0,hb,yb],[key.x1,hb,yb],[key.x1,hb,top],[key.x0,hb,top]);
  q([key.x0,-hb,yb],[key.x0,hb,yb],[key.x0,hb,top],[key.x0,-hb,top]);
  q([key.x1,-hb,yb],[key.x1,-hb,top],[key.x1,hb,top],[key.x1,hb,yb]);
  // радиальное отверстие Ø6 на x=25
  const hr=3,hx=25;for(let i=0;i<24;i++){const t0=i/24*2*Math.PI,t1=(i+1)/24*2*Math.PI;const a0=[hx+hr*Math.cos(t0),hr*Math.sin(t0),-19.7],b0=[hx+hr*Math.cos(t1),hr*Math.sin(t1),-19.7],a1=[a0[0],a0[1],19.7],b1=[b0[0],b0[1],19.7];tris.push([a0,b1,b0],[a0,a1,b1])}
  const buf=new ArrayBuffer(84+tris.length*50),dv=new DataView(buf);dv.setUint32(80,tris.length,true);
  tris.forEach((t,i)=>{const o=84+i*50;const n=V3.norm(V3.cross(V3.sub(t[1],t[0]),V3.sub(t[2],t[0])));n.forEach((v,k)=>dv.setFloat32(o+k*4,v,true));t.forEach((p,a)=>p.forEach((v,k)=>dv.setFloat32(o+12+a*12+k*4,v,true)))});
  return buf;
}

  if(IMPERR)html+=`<p class="err">${esc(IMPERR)}</p>`;
  if(IMP){const A=IMP,thr=A.bores.find(b=>b.through),kind=thr?"втулка / диск с отверстием":(A.L/A.Dmax>=1.6?"вал":"диск");
    const chips=[`${A.src} · ${A.stats}`,`Тип: ${kind}`,`L ${nn(A.L)} мм`,`Dmax ${nn(A.Dmax)} мм`,`${A.steps.length} пов.`].concat(A.keys.length?[`пазов: ${A.keys.length}`]:[],A.holes.length?[`отверстий: ${A.holes.length}`]:[],A.gears.length?[`венец z=${A.gears[0].z}`]:[],A.bores.length?[`осевых отв.: ${A.bores.length}`]:[],A.chams.length?[`фасок: ${A.chams.length}`]:[],A.center?["центровые отв."]:[],A.other);
    html+=`<div class="chips">${chips.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>
    ${A.src==="STL"&&A.score<0.6&&!A.gears.length?`<p class="err">Модель плохо похожа на тело вращения (${Math.round(A.score*100)}% поверхности симметрично оси). Проверьте результат или используйте STEP.</p>`:""}
    <img class="prof" src="${drawPart(A,{w:1400,h:560})}" alt="Профиль детали">
    <fieldset><legend>Поверхности — проверьте точность</legend>
    <div class="tw"><table class="it"><thead><tr><th>№</th><th>Вид</th><th>Ø, мм</th><th>L, мм</th><th>Точность</th><th>Посадка</th></tr></thead><tbody>
    ${A.steps.map((s,i)=>`<tr><td>${i+1}</td><td>${s.groove?"канавка":s.cone?"конус":"цилиндр"}</td><td class="nu">${nn(s.D)}</td><td class="nu">${nn(s.len)}</td>
      <td>${s.groove?"—":`<select data-ik="steps.${i}.acc">${opt(Object.entries(ACC_LBL),s.acc)}</select>`}</td><td>${s.groove?"":`<input data-ik="steps.${i}.fit" value="${esc(s.fit)}" size="4" placeholder="h14">`}</td></tr>`).join("")}
    ${A.bores.map((b,i)=>`<tr><td>отв.</td><td>отверстие${b.through?" сквозное":""}</td><td class="nu">${nn(b.d)}</td><td class="nu">${nn(b.x1-b.x0)}</td><td><select data-ik="bores.${i}.acc">${opt(Object.entries(ACC_LBL),b.acc)}</select></td><td><input data-ik="bores.${i}.fit" value="${esc(b.fit)}" size="4" placeholder="H12"></td></tr>`).join("")}
    </tbody></table></div>
    <p class="hint">Точность угадана по модели: посадочные места под подшипники и ступени с пазами — IT7 со шлифованием. В STEP/STL нет допусков, сверьте с чертежом.</p></fieldset>
    ${A.keys.length||A.holes.length||A.gears.length||A.flats.length?`<fieldset><legend>Найденные элементы</legend><div class="grid">
      ${A.keys.map((k,i)=>`<label class="f">${k.internal?"Паз в отверстии":"Шпоночный паз"} ${i+1}: b<input data-ik="keys.${i}.b" value="${k.b}"></label><label class="f">t<input data-ik="keys.${i}.t" value="${fmt(k.t,1)}"></label><label class="f">l<input data-ik="keys.${i}.l" value="${nn(k.l)}"></label>`).join("")}
      ${A.holes.map((hh,i)=>`<label class="f">Отверстие ${i+1}: Ø<input data-ik="holes.${i}.d" value="${nn(hh.d)}"></label><label class="f">От торца<input data-ik="holes.${i}.x" value="${nn(hh.x)}"></label>`).join("")}
      ${A.gears.map((gr,i)=>`<label class="f">Венец ${i+1}: z<input data-ik="gears.${i}.z" value="${gr.z}"></label><label class="f">m<input data-ik="gears.${i}.m" value="${fmt(gr.m,2)}"></label><label class="f">Da<input value="${nn(gr.Da)}" readonly></label>`).join("")}
      ${A.flats.map((f,i)=>`<label class="f">Лыска ${i+1}: t<input data-ik="flats.${i}.t" value="${fmt(f.t,1)}"></label>`).join("")}
    </div></fieldset>`:""}
    <fieldset><legend>Деталь и условия</legend><div class="grid">
      <label class="f w2">Обозначение<input data-io="oboz" value="${esc(IMPO.oboz)}"></label>
      <label class="f w2">Наименование<input data-io="name" value="${esc(IMPO.name)}"></label>
      <label class="f wall">Материал<select data-io="mat">${opt(Object.keys(MAT).map(k=>[k,k]),IMPO.mat)}</select></label>
      <label class="f w2">Термообработка<select data-io="termo">${opt([["none","без термообработки"],["ul","улучшение"],["tvch","закалка ТВЧ"],["cem","цементация и закалка"]],IMPO.termo)}</select></label>
      <label class="f w2">Производство<select data-io="prod">${opt([["ed","единичное / мелкосерийное (16К20)"],["ser","серийное (станки с ЧПУ)"]],IMPO.prod)}</select></label>
    </div></fieldset>
    <div class="row-actions"><button class="btn primary" data-ia="gen">Создать техпроцесс</button><span class="hint">Создаст новую карту, текущие не изменятся.</span></div>`;
  }
  ed.innerHTML=html;
  const inp=$("#m3dIn");inp.onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)importFile(f)};
  const dz=$("#drop");dz.ondragover=e=>{e.preventDefault();dz.classList.add("over")};dz.ondragleave=()=>dz.classList.remove("over");
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove("over");const f=e.dataTransfer.files[0];if(f)importFile(f)};
}
function impClick(e){
  const b=e.target.closest("[data-ia]");if(!b)return false;
  if(b.dataset.ia==="sample"){try{const A=analyzeSTL(sampleSTL(),"Вал_редуктора.stl");setImp(A,"КП.ДМ.03.01.002 Вал выходной.stl");IMPERR=""}catch(err){IMPERR=err.message}renderEditor()}
  if(b.dataset.ia==="gen"&&IMP){try{const c=genProcess(IMP,{...IMPO,org:card().h.org,razr:card().h.razr});S.cards.push(c);S.cur=c.id;S.tab="ops";S.kind="mok";save();renderAll();
    toast(`Техпроцесс создан: ${c.ops.length} операций. Проверьте точность, режимы и нормы`)}catch(err){toast("Не удалось составить техпроцесс: "+err.message)}}
  return true;
}
function impInput(e){
  const t=e.target;if(t.dataset.io!=null){IMPO[t.dataset.io]=t.value;return true}
  if(t.dataset.ik!=null&&IMP){const p=t.dataset.ik.split("."),o=IMP[p[0]][+p[1]],k=p[2];const v=t.value;
    o[k]=["acc","fit"].includes(k)?v:(k==="b"||k==="z"?(parseInt(v,10)||o[k]):(num(v)??o[k]));
    if(k==="acc"&&p[0]==="steps"){if(v==="7"&&!o.fit)o.fit="k6";if(v!=="7"&&o.fit==="k6")o.fit="";if(e.type==="change")renderEditor()}
    if(k==="m"||k==="z"){}return true}
  return false;
}
window.__tk={analyzeSTL,analyzeSTEP,genProcess,sampleSTL};

load();
/* карты из версии 1 без примера новых документов: дополняем пример группой, эскизом, комплектом и инструкцией */
S.cards.forEach(c=>{if(c.h.oboz==="КП.ДМ.02.01.003"&&!c.group.length&&!c.sk.length&&!c.kit.length&&!c.ti.length){const s=sample();["group","sk","kit","ti"].forEach(k=>c[k]=s[k]);["grpName","grpOboz","kitName","kitOboz","tiName"].forEach(k=>c.h[k]=s.h[k]);c.ops.forEach((o,i)=>{const so=s.ops.find(x=>x.num===o.num);if(so){["vid","meas","setup","var"].forEach(f=>{if(!o[f]||(f==="vid"&&o[f]==="Механическая обработка"))o[f]=so[f]})}});save()}});
renderAll();
})();
</script>
